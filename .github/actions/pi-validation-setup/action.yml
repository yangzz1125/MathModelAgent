name: Pi validation environment
description: Python 3.11, TeX, Poppler and a verified open Chinese font
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pi/requirements.txt
          pi/constraints-win-py311.txt
    - name: Install locked Python test dependencies
      shell: bash
      run: python -m pip install -r pi/requirements.txt -c pi/constraints-win-py311.txt httpx==0.28.1 pytest==9.1.1 pytest-timeout==2.4.0
    - uses: r-lib/actions/setup-tinytex@v2
    - name: TeX packages for Linux regression fixtures
      if: runner.os == 'Linux'
      shell: bash
      run: |
        tlmgr update --self
        tlmgr install xetex fontspec collection-latexrecommended ctex fandol xecjk zhnumber
    - name: TeX packages for Windows regression fixtures
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $tlmgr = (Get-Command tlmgr.bat -ErrorAction Stop).Source
        & $tlmgr update --self
        if ($LASTEXITCODE -ne 0) { throw 'TeX package manager update failed' }
        & $tlmgr install xetex fontspec collection-latexrecommended ctex fandol xecjk zhnumber
        if ($LASTEXITCODE -ne 0) { throw 'TeX regression package installation failed' }
    - name: Poppler on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
    - name: Verified Poppler binaries on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'poppler-windows.zip'
        $target = Join-Path $env:RUNNER_TEMP 'poppler-26.07.0-0'
        Invoke-WebRequest 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.07.0-0/Release-26.07.0-0.zip' -OutFile $zip -TimeoutSec 90
        $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($hash -ne 'a711b0563b06edc488583d28198b6734c5a494afbbd1b9d87d3d2866062fb7e2') { throw 'Poppler archive hash mismatch' }
        Expand-Archive -LiteralPath $zip -DestinationPath $target -Force
        $exe = Get-ChildItem $target -Filter pdfinfo.exe -File -Recurse | Select-Object -First 1
        if (-not $exe) { throw 'pdfinfo.exe not present in binary archive' }
        $bin = $exe.DirectoryName
        $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & "$bin/pdfinfo.exe" -v
        if ($LASTEXITCODE -ne 0) { throw 'pdfinfo executable validation failed' }
        & "$bin/pdftoppm.exe" -v
        if ($LASTEXITCODE -ne 0) { throw 'pdftoppm executable validation failed' }
    - name: Install and verify font and document tools
      shell: bash
      run: python .github/scripts/ci_font.py
