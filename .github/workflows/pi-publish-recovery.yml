name: Prepare verified Pi refactor
on:
  push:
    branches: [pi-reliability-efficiency-refactor]
    paths: [.github/workflows/pi-publish-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reassemble verified patch and prepare immutable tree only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root = 'https://api.github.com/repos/yangzz1125/MathModelAgent'
          def api(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(root+path, data=data, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response: return json.load(response)
          shas = ['ed1a118f7451e3263c183057e18500cc34a917b6','7b53e0c11b392ad6e7031c6ea6b325ad2b5bf7c0','512bfde7a553a50040de1ebe84ea875a6d7e47c0','9dae88096bdbeae33d069e2de154ca04b359b578','62a1c4a28512cab3377ffec976bd38a23df9dbde','c4036e1c7ee743a0199bb6e675f021d2801931a9','c0ee5b51ee8714eac7bbcfb5c4e006369d07e06c']
          chunks=[]
          for sha in shas:
              content=base64.b64decode(api('/git/blobs/'+sha)['content'])
              assert hashlib.sha1(f'blob {len(content)}\0'.encode()+content).hexdigest()==sha
              chunks.append(content)
          patch=lzma.decompress(b''.join(chunks))
          assert hashlib.sha256(patch).hexdigest()=='839bd1ec2daf25b59f2e5f0e9895e816680a87b0d0f7d81417fac7a6c61bf2d3'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          parent=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          assert len(paths)==33
          entries=[]
          for path in paths:
              assert not path.startswith('.github/workflows/')
              file=pathlib.Path(path)
              assert file.is_file() and not file.is_symlink()
              content=file.read_bytes()
              sha=hashlib.sha1(f'blob {len(content)}\0'.encode()+content).hexdigest()
              actual=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})['sha']
              assert actual==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=api('/git/trees',{'base_tree':base,'tree':entries})['sha']
          local=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==local
          out=pathlib.Path('publication');out.mkdir()
          manifest={'parent_sha':parent,'tree_sha':tree,'patch_sha256':hashlib.sha256(patch).hexdigest(),'files':entries}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          (out/'refactor.patch').write_bytes(patch)
          subprocess.run(['git','archive','--format=zip','--output=publication/source.zip',tree],check=True)
          print(json.dumps({'parent_sha':parent,'tree_sha':tree,'file_count':len(entries)}))
      - uses: actions/upload-artifact@v4
        with:
          name: pi-atomic-publication
          path: publication/
          retention-days: 7
          if-no-files-found: error
