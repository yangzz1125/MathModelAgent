name: Pi refactor validation
on:
  push:
    branches: [pi-reliability-efficiency-refactor]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pi-refactor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pi-source-snapshot
          path: source.zip
          retention-days: 3
          if-no-files-found: error
