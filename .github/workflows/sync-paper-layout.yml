name: Sync reviewed CUMCM layout changes
on:
  push:
    branches: [pi-reliability-efficiency-refactor]
    paths: [.github/workflows/sync-paper-layout.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run content-verified merge helper
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          sha = '8365b05ad5bbce32a34c6c23132a13978b38b412'
          url = f'https://api.github.com/repos/yangzz1125/MathModelAgent/git/blobs/{sha}'
          request = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest() == sha
          text = data.decode('utf-8')
          old = "assert git('rev-parse','HEAD^').stdout.strip()==EXPECTED,'Isolated branch moved; re-review before syncing'"
          new = "allowed_transport={'.github/workflows/sync-paper-layout.yml','.github/workflows/pi-publish-recovery.yml'}\nassert set(git('diff','--name-only',EXPECTED,'HEAD').stdout.splitlines()) <= allowed_transport, 'Source changed; re-review before syncing'"
          assert text.count(old) == 1
          text = text.replace(old,new,1).replace("EXPECTED='a1d4989713679e509963dfb54dcf5303ee0fe585'", "EXPECTED='f0406da105cd29eea95efbd0ce05b6d6d62e15bd'")
          a = text.index('# Windows must execute')
          b = text.index("Path('pi/tests/test_balanced_layout.py')",a)
          replacement = "# Preserve the independently corrected Windows setup; only add CUMCM packages.\nimport hashlib\np=Path('.github/actions/pi-validation-setup/action.yml');s=p.read_text()\ncontent=p.read_bytes()\nassert hashlib.sha1(f'blob {len(content)}\\0'.encode()+content).hexdigest()=='cf1abe93a1304bfffefe086bdd088414b4872d3c'\nassert s.count('collection-latexrecommended')==2\ns=s.replace('collection-latexrecommended','collection-latexrecommended ctex fandol xecjk zhnumber')\np.write_text(s,encoding='utf-8')\n"
          data = (text[:a]+replacement+text[b:]).encode('utf-8')
          assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest() == 'b367935ff33e60a363ba73112ce6b7b1dd0e698f'
          script = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sync-reviewed-layout.py'
          script.write_bytes(data)
          subprocess.run(['python',str(script)],check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: pi-refactor-merged-source
          path: merged-source.zip
          retention-days: 3
          if-no-files-found: error
